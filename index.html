<script>
var SC={sanstha:'Shri Vitthal Shikshan Sanstha',name:'Shri Vitthal Vidyalaya & Jr. College',addr:'Near Bus Stand, Dhule, Maharashtra - 424001',email:'info@vitthalvidyalaya.edu.in',phone:'+91-2562-234567',udise:'27040100102'};
var students=[];
var lcN=0;

function load(){
  try{var a=localStorage.getItem('lcg3_sc');if(a)SC=JSON.parse(a);}catch(e){}
  try{var b=localStorage.getItem('lcg3_st');if(b)students=JSON.parse(b);}catch(e){}
  try{var c=localStorage.getItem('lcg3_n');if(c)lcN=parseInt(c);}catch(e){}
  syncSC();renderList();
}
function persist(){
  localStorage.setItem('lcg3_sc',JSON.stringify(SC));
  localStorage.setItem('lcg3_st',JSON.stringify(students));
  localStorage.setItem('lcg3_n',''+lcN);
}
function syncSC(){
  setv('s_sanstha',SC.sanstha);setv('s_school',SC.name);setv('s_addr',SC.addr);setv('s_email',SC.email);setv('s_phone',SC.phone);setv('s_udise',SC.udise);
}
function getv(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function setv(id,v){var e=document.getElementById(id);if(e)e.value=v||'';}

function toggleSettings(){
  var el=document.getElementById('sec-settings');
  el.style.display=el.style.display==='none'?'block':'none';
  if(el.style.display==='block')syncSC();
}
function saveSchool(){
  SC={sanstha:getv('s_sanstha'),name:getv('s_school'),addr:getv('s_addr'),email:getv('s_email'),phone:getv('s_phone'),udise:getv('s_udise')};
  persist();showMsg('School settings saved!','ok');document.getElementById('sec-settings').style.display='none';

function pad4(n){
  return n<10 ? '000'+n :
         n<100 ? '00'+n :
         n<1000 ? '0'+n :
         ''+n;
}
function toDay(){return new Date().toISOString().slice(0,10);}
function fmtD(d){
  if(!d)return '—';

  var dt=new Date(d);

  var day=String(dt.getDate()).padStart(2,'0');
  var month=String(dt.getMonth()+1).padStart(2,'0');
  var year=dt.getFullYear();

  return day+' / '+month+' / '+year;
}
function dobWords(d){

  if(!d)return '—';

  var dt=new Date(d);

  var days=[
    '', 'First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth','Ninth',
    'Tenth','Eleventh','Twelfth','Thirteenth','Fourteenth','Fifteenth',
    'Sixteenth','Seventeenth','Eighteenth','Nineteenth','Twentieth',
    'Twenty First','Twenty Second','Twenty Third','Twenty Fourth',
    'Twenty Fifth','Twenty Sixth','Twenty Seventh','Twenty Eighth',
    'Twenty Ninth','Thirtieth','Thirty First'
  ];

  var months=[
    'January','February','March','April','May','June',
    'July','August','September','October','November','December'
  ];

 function yearToWords(y){

  var ones=[
    'Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
    'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen',
    'Sixteen','Seventeen','Eighteen','Nineteen'
  ];

  var tens=[
    '','','Twenty','Thirty','Forty','Fifty',
    'Sixty','Seventy','Eighty','Ninety'
  ];

  function two(n){
    if(n<20)return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' '+ones[n%10] : '');
  }

  if(y<100)return two(y);

  if(y<1000){
    return ones[Math.floor(y/100)]+' Hundred '+two(y%100);
  }

  return two(Math.floor(y/1000))+' Thousand '+two(y%1000);
}
  return days[dt.getDate()] + ' ' +
         months[dt.getMonth()] + ' ' +
         yearToWords(dt.getFullYear());
}

function doBackup(){
  var d={v:3,sc:SC,students:students,lcN:lcN,date:new Date().toISOString()};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);var a=document.createElement('a');
  a.href=u;a.download='LC_Backup_'+toDay()+'.json';a.click();URL.revokeObjectURL(u);
  showMsg('Backup downloaded!','ok');
}
function doRestore(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!d.students)throw 1;
      if(!confirm('Restore '+d.students.length+' students? Current data will be overwritten.'))return;
      SC=d.sc||SC;students=d.students;lcN=d.lcN||0;
      persist();syncSC();renderList();showMsg('Restored successfully!','ok');
    }catch(ex){showMsg('Invalid backup file!','err');}
  };r.readAsText(f);
}
